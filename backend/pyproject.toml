[project]
name = "face-recognition-based-attendance-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.0",
    "bcrypt<4.0.0",
    "email-validator>=2.1.0",
    "fastapi>=0.115.0",
    "matplotlib>=3.8.0",
    "passlib>=1.7.4",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "polars>=0.20.0",
    "web3>=6.0.0",
    "diskcache>=5.6.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "uvicorn[standard]>=0.30.0",
    "opencv-contrib-python-headless>=4.10.0",
    "pillow>=10.3.0",
    "httpx>=0.24.1",
    "cryptography>=41.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
biometrics = [
    "deepface>=0.0.99",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "tf-keras>=2.21.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "responses>=0.25.0",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
