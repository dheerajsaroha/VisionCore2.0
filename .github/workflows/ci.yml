name: VisionCore CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - name: Install dependencies
        run: |
          cd backend
          uv sync --locked --group dev
      - name: Lint backend
        run: |
          cd backend
          uv run --locked flake8 app/ --max-line-length=120
          uv run --locked black --check app/
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --locked --group dev
      - name: Run backend tests
        env:
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long-for-ci
        run: |
          cd backend
          uv run --locked python -m pytest app/tests/ -v

  validate:
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_db
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - name: Install dependencies
        run: |
          cd backend
          uv sync --locked --group dev
      - name: Start server
        env:
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long-for-ci
        run: |
          cd backend
          uv run --locked python main.py &
          sleep 5
      - name: Run platform validation
        env:
          POSTGRES_PASSWORD: postgres
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long-for-ci
        run: |
          cd backend
          uv run --locked python runtime_validation_platform.py

  deploy:
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Build and push Docker images
        run: |
          docker compose -f deploy/docker-compose.yml build
          # Add deployment commands here
